<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Site Temporarily Unavailable | Kaushik Parui</title>

  <!-- Apply saved/system theme before first paint (no flash) -->
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem("theme"); } catch (e) {}
      if (t !== "light" && t !== "dark") {
        t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      }
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>

  <!-- Favicon -->
  <link rel="icon" href="/assets/favicon/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon/favicon-16x16.png" />

  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- CSS -->
  <link rel="stylesheet" href="styles/outage.css" />

  <!-- SEO -->
  <meta name="description" content="Temporary outage. Kaushik Parui portfolio is currently unavailable. Check live system status for updates." />
  <meta name="author" content="Kaushik Parui" />

  <!-- Prevent indexing -->
  <meta name="robots" content="noindex, nofollow" />

  <!-- Canonical (point to main site) -->
  <link rel="canonical" href="https://www.kaushikparui.com/" />

  <!-- Open Graph -->
  <meta property="og:title" content="Service Unavailable | Kaushik Parui" />
  <meta property="og:description" content="The site is temporarily down. We're working to restore it quickly." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://outage.kaushikparui.com" />
  <meta property="og:image" content="https://www.kaushikparui.com/social-preview.webp" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Service Unavailable | Kaushik Parui" />
  <meta name="twitter:description" content="Temporary outage. Live status available." />
  <meta name="twitter:image" content="https://www.kaushikparui.com/social-preview.webp" />

  <!-- Theme color -->
  <meta name="theme-color" content="#07040f" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f5f2ff" media="(prefers-color-scheme: light)" />

  <!-- Performance -->
  <link rel="preload" as="image" href="assets/logo/logo-ag-light.webp" />
  <link rel="preload" as="image" href="assets/logo/logo-ag-dark.webp" />
</head>

<body>
  <!-- Ambient background -->
  <div class="aurora" aria-hidden="true">
    <span class="orb orb-1"></span>
    <span class="orb orb-2"></span>
    <span class="orb orb-3"></span>
    <span class="grid"></span>
    <span class="grain"></span>
  </div>

  <!-- Theme toggle -->
  <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle light and dark theme">
    <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
    </svg>
    <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="4" />
      <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
    </svg>
  </button>

  <main class="card" role="main">
    <div class="logo-container">
      <img src="assets/logo/logo-ag-light.webp" alt="Kaushik Parui" class="logo logo-dark" />
      <img src="assets/logo/logo-ag-dark.webp" alt="" class="logo logo-light" />
    </div>

    <div class="alert-badge" role="status" aria-label="Service disruption">
      <span class="ring" aria-hidden="true"></span>
      <span class="ring" aria-hidden="true"></span>
      <span class="ring" aria-hidden="true"></span>
      <span class="core" aria-hidden="true">🚨</span>
    </div>

    <h1>We'll be right back</h1>

    <p>
      <strong>kaushikparui.com</strong> is currently experiencing a service disruption.
    </p>
    <p>
      Our team is actively working to restore everything as quickly as possible.
    </p>

    <div class="actions">
      <a class="btn btn-primary" href="https://status.kaushikparui.com">
        View live incident report
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
      </a>
      <a class="btn btn-ghost" href="https://kaushikparui.com">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7M21 4v5h-5" /></svg>
        Try again
      </a>
    </div>

    <div class="footer">
      Thanks for your patience, we'll be back shortly.
    </div>
  </main>

  <script>
    (function () {
      var root = document.documentElement;
      var btn = document.getElementById("themeToggle");

      btn.addEventListener("click", function () {
        var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
        root.setAttribute("data-theme", next);
        try { localStorage.setItem("theme", next); } catch (e) {}
      });
    })();
  </script>
</body>
</html>
